version: "3.9"

services:
  freeradius:
    image: freeradius/freeradius-server:3.2.3
    container_name: oxion-freeradius-harness
    command: ["freeradius", "-X"]
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    volumes:
      - ./config/clients.conf:/etc/freeradius/3.0/clients.conf:ro
